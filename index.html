<style>
  :root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --card-shadow:    0 1px 2px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top { margin-bottom: 28px; }
  header.top h1 { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  header.top p { margin:0; color: var(--text-secondary); font-size: 14px; }

  section { margin-bottom: 36px; }
  h2 { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); margin: 0 0 12px; font-weight: 600; }

  .stat-row { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; }
  .stat-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; box-shadow: var(--card-shadow);
  }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-tile .value { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 19px; font-weight: 600; overflow-wrap: break-word; word-break: break-word; }
  .stat-tile .sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; box-shadow: var(--card-shadow);
  }

  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width:100%; min-width: 620px; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--gridline); }
  th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; }
  tbody tr:last-child td { border-bottom: none; }
  th.num { text-align: right; }
  td.num { text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .manager-chip { display:inline-flex; align-items:center; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; flex: none; }

  .bars { display:flex; flex-direction:column; gap: 10px; }
  .bar-row { display:grid; grid-template-columns: 150px 1fr 34px; align-items:center; gap:10px; }
  .bar-row .name { font-size: 13px; display:flex; align-items:center; gap:7px; }
  .bar-track { position:relative; height: 14px; background: var(--gridline); border-radius: 4px; overflow:hidden; }
  .bar-fill { position:absolute; left:0; top:0; bottom:0; border-radius: 4px; min-width: 4px; }
  .bar-row .val { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; text-align:right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }

  .season-list { display:flex; flex-direction:column; gap: 10px; }
  .season-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; background: var(--surface-1); }
  .season-head { display:flex; align-items:center; justify-content:space-between; gap: 10px; cursor:pointer; }
  .season-head .yr { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight:600; font-size: 14px; }
  .season-head .podio-line { font-size: 12.5px; color: var(--text-secondary); }
  .season-body { display:none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--gridline); font-size: 13px; }
  .season-card.open .season-body { display:block; }
  .trophy-line { color: var(--text-secondary); margin-bottom: 8px; }
  .trophy-line b { color: var(--text-primary); font-weight:600; }
  .partecipanti-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 4px 14px; }
  .partecipanti-grid div { font-size: 12.5px; color: var(--text-secondary); }
  .partecipanti-grid b { color: var(--text-primary); font-weight: 500; }

  @media (max-width: 560px) {
    .bar-row { grid-template-columns: 96px 1fr 30px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Albo d'Oro TikiFanta</h1>
    <p id="subtitle">8 stagioni · 2018/19 → 2025/26</p>
  </header>

  <section>
    <h2>Panoramica</h2>
    <div class="stat-row" id="statRow"></div>
  </section>

  <section>
    <h2>Titoli vinti (1° posto)</h2>
    <div class="card">
      <div class="bars" id="titleBars"></div>
    </div>
  </section>

  <section>
    <h2>Classifica premi vinti</h2>
    <div class="card">
      <div class="bars" id="premiBars"></div>
    </div>
  </section>

  <section>
    <h2>Fornacella d'oro (ultimo posto)</h2>
    <div class="card">
      <div class="bars" id="ultimoBars"></div>
    </div>
  </section>

  <section>
    <h2>Bacheca trofei</h2>
    <div class="card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Manager</th>
              <th class="num">Stagioni</th>
              <th class="num">Titoli</th>
              <th class="num">Podi</th>
              <th class="num">Tronere</th>
              <th class="num">HCupOkkia</th>
              <th class="num">FantaSfiga</th>
              <th class="num">Ultimo</th>
            </tr>
          </thead>
          <tbody id="trophyTable"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section>
    <h2>Stagioni</h2>
    <div class="season-list" id="seasonList"></div>
  </section>

</div>

<script>
(function(){
  var PALETTE = {
    "Simone":            "#3987e5",
    "Saverio/Gianfranco":"#d95926",
    "Antonello":         "#199e70",
    "Vincenzo":          "#c98500",
    "Alessio":           "#d55181",
    "Vito/Stefano":      "#008300",
    "Gianvito":          "#9085e9",
    "Stefano":           "#e66767"
  };
  var FALLBACK_COLOR = "#898781";

  function colorFor(name){ return PALETTE[name] || FALLBACK_COLOR; }

  var seasons = JSON.parse(document.getElementById('season-data').textContent);

  function seasonSortKey(y){
    // "2018/19" -> 2018
    return parseInt(y.split('/')[0], 10) || 0;
  }
  seasons.sort(function(a,b){ return seasonSortKey(a.year) - seasonSortKey(b.year); });

  function computeStats(){
    var stats = {};
    function ensure(name){
      if(!stats[name]) stats[name] = {manager:name, stagioni:0, titoli:0, secondi:0, terzi:0, tronere:0, hcupokkia:0, fantasfiga:0, ultimo:0};
      return stats[name];
    }
    seasons.forEach(function(s){
      s.partecipanti.forEach(function(p){ ensure(p.manager).stagioni++; });
      if(s.podio[0]) ensure(s.podio[0]).titoli++;
      if(s.podio[1]) ensure(s.podio[1]).secondi++;
      if(s.podio[2]) ensure(s.podio[2]).terzi++;
      if(s.tronere) ensure(s.tronere).tronere++;
      if(s.hcupokkia) ensure(s.hcupokkia).hcupokkia++;
      if(s.fantasfiga) ensure(s.fantasfiga).fantasfiga++;
      if(s.ultimo) ensure(s.ultimo).ultimo++;
    });
    Object.keys(stats).forEach(function(k){
      var s = stats[k];
      s.podi = s.titoli + s.secondi + s.terzi;
      s.premi = s.podi + s.tronere + s.hcupokkia + s.fantasfiga;
    });
    return stats;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderBars(elId, rows, valueKey, maxVal){
    document.getElementById(elId).innerHTML = rows.map(function(s){
      var val = s[valueKey];
      var pct = Math.round((val / maxVal) * 100);
      return '<div class="bar-row">'+
        '<div class="name"><span class="dot" style="background:'+colorFor(s.manager)+'"></span>'+escapeHtml(s.manager)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+colorFor(s.manager)+'"></div></div>'+
        '<div class="val">'+val+'</div>'+
      '</div>';
    }).join('');
  }

  function render(){
    var stats = computeStats();
    var statsArr = Object.keys(stats).map(function(k){ return stats[k]; });

    document.getElementById('subtitle').textContent =
      seasons.length + ' stagioni · ' + seasons[0].year + ' → ' + seasons[seasons.length-1].year;

    // --- overview tiles ---
    var byTitoli = statsArr.slice().sort(function(a,b){ return b.titoli - a.titoli || b.podi - a.podi; });
    var byPodi = statsArr.slice().sort(function(a,b){ return b.podi - a.podi; });
    var byPremi = statsArr.slice().sort(function(a,b){ return b.premi - a.premi; });
    var byUltimo = statsArr.slice().sort(function(a,b){ return b.ultimo - a.ultimo; });
    var leader = byTitoli[0];
    var podiLeader = byPodi[0];
    var premiLeader = byPremi[0];
    var cucchiaio = byUltimo[0] && byUltimo[0].ultimo > 0 ? byUltimo[0] : null;

    var tiles = [
      { label: 'Stagioni disputate', value: seasons.length, sub: seasons[0].year + ' – ' + seasons[seasons.length-1].year },
      { label: 'Più titoli', value: leader ? leader.manager : '—', sub: leader ? leader.titoli + ' titol' + (leader.titoli===1?'o':'i') : '' },
      { label: 'Più podi', value: podiLeader ? podiLeader.manager : '—', sub: podiLeader ? podiLeader.podi + ' pod' + (podiLeader.podi===1?'io':'i') : '' },
      { label: 'Più premi vinti', value: premiLeader ? premiLeader.manager : '—', sub: premiLeader ? premiLeader.premi + ' premi' : '' },
      { label: "Fornacella d'oro", value: cucchiaio ? cucchiaio.manager : '—', sub: cucchiaio ? cucchiaio.ultimo + ' volt' + (cucchiaio.ultimo===1?'a':'e') + ' ultimo' : 'nessun dato' }
    ];
    document.getElementById('statRow').innerHTML = tiles.map(function(t){
      return '<div class="stat-tile"><div class="label">'+t.label+'</div><div class="value">'+escapeHtml(String(t.value))+'</div><div class="sub">'+escapeHtml(t.sub)+'</div></div>';
    }).join('');

    // --- title bar chart ---
    var maxTitoli = Math.max(1, byTitoli[0] ? byTitoli[0].titoli : 1);
    renderBars('titleBars', byTitoli, 'titoli', maxTitoli);

    // --- premi bar chart (podi + tronere + hcupokkia + fantasfiga) ---
    var maxPremi = Math.max(1, byPremi[0] ? byPremi[0].premi : 1);
    renderBars('premiBars', byPremi, 'premi', maxPremi);

    // --- fornacella d'oro bar chart (ultimo posto) ---
    var maxUltimo = Math.max(1, byUltimo[0] ? byUltimo[0].ultimo : 1);
    renderBars('ultimoBars', byUltimo, 'ultimo', maxUltimo);

    // --- trophy table ---
    var trophyRows = statsArr.slice().sort(function(a,b){ return b.titoli - a.titoli || b.podi - a.podi || b.stagioni - a.stagioni; });
    document.getElementById('trophyTable').innerHTML = trophyRows.map(function(s){
      return '<tr>'+
        '<td><span class="manager-chip"><span class="dot" style="background:'+colorFor(s.manager)+'"></span>'+escapeHtml(s.manager)+'</span></td>'+
        '<td class="num">'+s.stagioni+'</td>'+
        '<td class="num">'+s.titoli+'</td>'+
        '<td class="num">'+s.podi+'</td>'+
        '<td class="num">'+s.tronere+'</td>'+
        '<td class="num">'+s.hcupokkia+'</td>'+
        '<td class="num">'+s.fantasfiga+'</td>'+
        '<td class="num">'+s.ultimo+'</td>'+
      '</tr>';
    }).join('');

    // --- season list ---
    var seasonListHtml = seasons.slice().reverse().map(function(s){
      var podioLine = [s.podio[0],s.podio[1],s.podio[2]].map(function(m,i){
        return m ? (['🥇','🥈','🥉'][i] + ' ' + m) : '';
      }).filter(Boolean).join('  ·  ');
      var trophyBits = [];
      if(s.tronere) trophyBits.push('<span class="trophy-line"><b>Tronere:</b> '+escapeHtml(s.tronere)+'</span>');
      if(s.hcupokkia) trophyBits.push('<span class="trophy-line"><b>HCupOkkia:</b> '+escapeHtml(s.hcupokkia)+'</span>');
      if(s.fantasfiga) trophyBits.push('<span class="trophy-line"><b>FantaSfiga:</b> '+escapeHtml(s.fantasfiga)+'</span>');
      if(s.ultimo) trophyBits.push('<span class="trophy-line"><b>Ultimo:</b> '+escapeHtml(s.ultimo)+'</span>');
      var partHtml = s.partecipanti.map(function(p){
        return '<div><b>'+escapeHtml(p.manager)+'</b>'+(p.team? ' — '+escapeHtml(p.team) : '')+'</div>';
      }).join('');
      return '<div class="season-card">'+
        '<div class="season-head" data-toggle="1">'+
          '<div><div class="yr">'+escapeHtml(s.year)+'</div><div class="podio-line">'+(podioLine||'Podio non assegnato')+'</div></div>'+
        '</div>'+
        '<div class="season-body">'+
          '<div style="margin-bottom:10px;">'+(trophyBits.join(' &nbsp; ') || '<span class="trophy-line">Nessun premio speciale registrato</span>')+'</div>'+
          '<div class="partecipanti-grid">'+partHtml+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
    document.getElementById('seasonList').innerHTML = seasonListHtml;

    document.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        el.closest('.season-card').classList.toggle('open');
      });
    });
  }

  render();
})();
</script>
</body>
</html>
